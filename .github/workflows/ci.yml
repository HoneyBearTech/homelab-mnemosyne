name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # The required status check on main; keep this name (the branch ruleset refers to it).
    name: Checks + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history, not just this commit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the check and test tools
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      # Coding standards (CONTRIBUTING.md#coding-standards). Any finding fails the build.
      - name: Lint Python (ruff)
        run: |
          ruff check --output-format github .
          ruff format --check .

      - name: Lint YAML (yamllint)
        run: yamllint --strict --format github .

      - name: Lint shell scripts (shellcheck)
        run: shellcheck -x --format gcc scripts/*.sh initdb/postgres/*.sh initdb/mariadb/*.sh

      # Docker Hub limits anonymous pulls per address, and the runners share theirs. With the project's read-only
      # Docker Hub token (GOVERNANCE.md#the-projects-own-secrets) the pull counts against its account instead.
      # Fork pull requests get no secrets and pull anonymously.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::No Docker Hub token; pulling anonymously"
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Lint workflows (actionlint, with shellcheck)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      # The checkout belongs to another user inside the container, so git needs safe.directory, and the step
      # fails if gitleaks ever scans nothing (it would otherwise report "no leaks found").
      - name: No secrets in the repository or its history (gitleaks)
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --no-color /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -Eq ' 0 commits scanned|ERR' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks didn't scan the history"
            exit 1
          fi

      # Offline: JSON fixtures only, no Docker, no network. The floor is in pyproject.toml.
      - name: Unit tests with coverage (pytest)
        run: |
          coverage run -m pytest
          coverage report

      # The stack itself: the Compose file resolves with the example settings, and every service meets the
      # policy (pinned by digest, nothing privileged; scripts/check_compose.py). Skipped until compose.yaml exists.
      - name: Compose file and policy
        run: |
          if [ ! -f compose.yaml ]; then
            echo "::notice::No compose.yaml yet; skipping the stack checks"
            exit 0
          fi
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json | python scripts/check_compose.py

      # The engines' watch list matches what compose.yaml pins (scripts/check_watches.py): a pinned engine that Diun
      # doesn't watch would never alert.
      - name: Engine watches match the pins
        run: python scripts/check_watches.py

  smoke:
    # A required check on main, like "Checks + tests", so an image that doesn't start can't be auto-merged.
    name: Stack smoke test
    # Amd64, like the server, so the images are tested for the platform they run on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every image the smoke test runs is pulled while logged in to Docker Hub (see the "Checks + tests" job),
      # and the login is gone before any of them starts: an image under test, such as a Dependabot update, mustn't
      # be able to read the token.
      - name: Pull the stack's images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ ! -f compose.yaml ]; then
            exit 0
          fi
          # Logged out at the end either way: a runner image can come with a Docker Hub entry of its own (x64 does).
          trap 'docker logout' EXIT
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          else
            echo "::notice::No Docker Hub token; pulling anonymously"
          fi
          { docker compose --env-file .env.example config --images; sed -n 's/^busybox=//p' scripts/lib.sh; } |
            sort -u | while read -r image; do docker pull --quiet "$image"; done

      - name: No Docker Hub login left
        run: |
          if grep -q 'index.docker.io' "$HOME/.docker/config.json" 2>/dev/null; then
            echo "::error::still logged in to Docker Hub"
            exit 1
          fi

      # The scheduled backup's encrypted copy off the host (BACKUP_AGE_RECIPIENT) is tested with age.
      - name: Install age
        run: sudo apt-get update --quiet && sudo apt-get install --yes --no-install-recommends age

      # Every service from compose.yaml, started with throwaway directories and volumes, must report healthy
      # within five minutes, and survive a dump and restore (scripts/smoke-test.sh). Logs of every service are
      # printed if one doesn't. Passes with a notice while there is no compose.yaml.
      - name: Start the stack and wait until every service is healthy
        run: scripts/smoke-test.sh
