name: Release

# A release: pushing a version tag (vX.Y.Z) publishes that version of the stack. homelab-mnemosyne builds no
# images of its own; a release pins a set of upstream images by digest. The GitHub Release carries the
# CHANGELOG.md section for the version, a source archive (with LICENSE), a CycloneDX SBOM listing every
# service's image and digest, a SHA256SUMS signed keylessly with cosign (Sigstore, identity = this workflow
# on the tag), and SLSA build provenance for those files, as a Sigstore bundle and as in-toto JSON Lines.
# How to verify: docs/verifying-releases.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # keyless signing of SHA256SUMS and of the provenance
      attestations: write # store the provenance attestation in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The release must meet the same policy as main: every image pinned by digest, nothing privileged.
      - name: Policy check and SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ ! -f compose.yaml ]; then
            echo "::error::There is no compose.yaml to release"
            exit 1
          fi
          cp .env.example .env
          docker compose config --format json > compose.json
          python scripts/check_compose.py compose.json --sbom "homelab-mnemosyne-${version}.cdx.json"

      - name: Source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="homelab-mnemosyne-${version}/" \
            -o "homelab-mnemosyne-${version}.tar.gz" HEAD
          sha256sum "homelab-mnemosyne-${version}.tar.gz" "homelab-mnemosyne-${version}.cdx.json" > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # SLSA build provenance for every file in SHA256SUMS: signed (Sigstore), stored as a GitHub
      # attestation (gh attestation verify) and attached as the full Sigstore bundle.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          version="${TAG#v}"
          cp "$BUNDLE" "homelab-mnemosyne-${version}.provenance.sigstore.json"
          # The same provenance as in-toto JSON Lines (one DSSE envelope per line), the format tools such as
          # OpenSSF Scorecard look for in release assets.
          jq -c '.dsseEnvelope' "$BUNDLE" > "homelab-mnemosyne-${version}.intoto.jsonl"
          test -s "homelab-mnemosyne-${version}.intoto.jsonl"
          # The "## [x.y.z]" section of CHANGELOG.md, up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # Repo-relative links would resolve against the release page; point them at the tag.
          perl -pi -e 's{\]\((?!https?://|#)([^)]+)\)}{](https://github.com/$ENV{REPO}/blob/$ENV{TAG}/$1)}g' notes.md
          verify="https://github.com/${REPO}/blob/${TAG}/docs/verifying-releases.md"
          printf '\n---\nVerify this release: [docs/verifying-releases.md](%s)\n' "$verify" >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "homelab-mnemosyne ${TAG}" --notes-file notes.md \
            homelab-mnemosyne-*.tar.gz homelab-mnemosyne-*.cdx.json SHA256SUMS SHA256SUMS.sigstore.json \
            homelab-mnemosyne-*.provenance.sigstore.json homelab-mnemosyne-*.intoto.jsonl
