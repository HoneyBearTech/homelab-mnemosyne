name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's patch, minor and major update PRs and for image rebuilds (same tag,
# new digest), so they're squash-merged once every required check passes (the main ruleset still decides: CI with
# the Compose policy check, CodeQL, dependency review, signed commits). Nothing is checked out or run from the PR;
# the job only reads Dependabot's metadata and the PR's diff and calls `gh`. A merge deploys: the server's pull
# agent applies main within minutes (docs/upgrading.md).
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'HoneyBearTech/homelab-mnemosyne'
    # Only this job writes, to turn on auto-merge for the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Images, Python tools and Actions: patch, minor and major updates (owner 2026-10-14). A new major app version
      # can migrate its data one way and now deploys unattended, with the nightly backup behind it (a revert alone
      # doesn't undo such a migration: restore from the backup). Any update Dependabot can't classify, such as a
      # tag scheme it doesn't read as a version, still waits for the maintainer.
      - name: Enable auto-merge for version updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Image rebuilds: the same tag with a new digest (a linuxserver.io `version-<app version>` or bare version tag
      # moving to a rebuild of the same app version), which Dependabot doesn't classify (owner 2026-10-14, as on
      # homelab-atlas). Merged only when compose.yaml is the one file changed, every changed line is an `image:`
      # line, and the image tags before and after are the same, so no app version changes. The diff is read as
      # text; nothing from the PR runs.
      - name: Enable auto-merge for image rebuilds (same tag, new digest)
        if: >-
          steps.metadata.outputs.package-ecosystem == 'docker_compose' &&
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          files=$(gh pr diff --name-only "$PR_URL")
          diff=$(gh pr diff "$PR_URL")
          changed=$(printf '%s\n' "$diff" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ')
          tags() {
            printf '%s\n' "$changed" | sed -n "s/^$1[[:space:]]*image:[[:space:]]*//p" | sed 's/@sha256:.*//' | sort
          }
          before=$(tags -)
          after=$(tags '+')
          others=$(printf '%s\n' "$changed" | grep -cvE '^[-+][[:space:]]*image:' || true)
          if [ "$files" = "compose.yaml" ] && [ -n "$before" ] && [ "$before" = "$after" ] && [ "$others" = 0 ]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Not a rebuild-only image update; left for the maintainer."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
